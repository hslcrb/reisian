<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Reisian brand board</title>
  <desc id="desc">A warm editorial identity: folded R, serif wordmark, Make the web feel like you, and five palette swatches: paper, ink, plum, sage and lavender.</desc>
  <rect width="1200" height="1000" fill="#F4F1EA"/>
  <g fill="#30252D" font-family="Arial, sans-serif">
    <text x="64" y="65" font-size="14" letter-spacing="3">REISIAN / VISUAL IDENTITY</text>
    <text x="1136" y="65" text-anchor="end" font-size="14">01 — FOLDED FORM</text>
    <path d="M64 88H1136" stroke="#30252D" stroke-opacity=".2"/>
    <g transform="translate(44 126) scale(1.35)"><path fill="#71354D" fill-rule="evenodd" d="M32 104V24H70C93 24 108 37 108 57C108 74 97 86 80 89L108 120H79L52 89V120H32V104ZM52 43V71H68C80 71 87 66 87 57C87 48 80 43 68 43H52Z"/><path fill="#A9687E" d="M52 89H80L108 120H79Z"/><text x="146" y="104" font-family="Georgia, Times New Roman, serif" font-size="92" letter-spacing="-5">Reisian</text></g>
    <text x="64" y="390" font-family="Georgia, Times New Roman, serif" font-size="65" letter-spacing="-2">Make the web</text>
    <text x="64" y="465" font-family="Georgia, Times New Roman, serif" font-size="65" font-style="italic" letter-spacing="-2">feel like you.</text>
    <text x="67" y="522" font-size="17">A visual instrument for an expressive web.</text>
    <rect x="820" y="142" width="316" height="420" rx="158" fill="#D2DDD2"/>
    <rect x="883" y="205" width="190" height="294" rx="95" fill="#CCC5E5"/>
    <g transform="translate(874 236) scale(1.4)"><path fill="#71354D" fill-rule="evenodd" d="M32 104V24H70C93 24 108 37 108 57C108 74 97 86 80 89L108 120H79L52 89V120H32V104ZM52 43V71H68C80 71 87 66 87 57C87 48 80 43 68 43H52Z"/><path fill="#A9687E" d="M52 89H80L108 120H79Z"/></g>
    <path d="M64 618H1136" stroke="#30252D" stroke-opacity=".2"/>
    <text x="64" y="665" font-size="14" letter-spacing="2">WARMTH / CLARITY / POSSIBILITY</text>
    <text x="64" y="715" font-size="14">An open window. A folded ribbon. Your next beginning.</text>
    <rect x="64" y="742" width="196" height="104" rx="4" fill="#F4F1EA" stroke="#30252D" stroke-opacity=".1"/><text x="64" y="874" font-size="16">Paper</text><text x="64" y="900" font-size="14" opacity=".65">#F4F1EA</text><rect x="280" y="742" width="196" height="104" rx="4" fill="#30252D" stroke="#30252D" stroke-opacity=".1"/><text x="280" y="874" font-size="16">Ink</text><text x="280" y="900" font-size="14" opacity=".65">#30252D</text><rect x="496" y="742" width="196" height="104" rx="4" fill="#71354D" stroke="#30252D" stroke-opacity=".1"/><text x="496" y="874" font-size="16">Plum</text><text x="496" y="900" font-size="14" opacity=".65">#71354D</text><rect x="712" y="742" width="196" height="104" rx="4" fill="#D2DDD2" stroke="#30252D" stroke-opacity=".1"/><text x="712" y="874" font-size="16">Sage</text><text x="712" y="900" font-size="14" opacity=".65">#D2DDD2</text><rect x="928" y="742" width="196" height="104" rx="4" fill="#CCC5E5" stroke="#30252D" stroke-opacity=".1"/><text x="928" y="874" font-size="16">Lavender</text><text x="928" y="900" font-size="14" opacity=".65">#CCC5E5</text>
    <text x="64" y="965" font-size="13" opacity=".65">Original vector identity · Reisian contributors · 2026</text>
    <text x="1136" y="965" text-anchor="end" font-size="13" opacity=".65">REISIAN STUDIO</text>
